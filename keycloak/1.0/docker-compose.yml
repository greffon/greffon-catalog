version: "3"

# Keycloak: standalone identity provider (OIDC / OAuth2 / SAML).
#
# This is the *unbundled* Keycloak: a first-class greffon an operator runs once
# and points other apps at, rather than the per-app embedded Keycloak that the
# Docs and Visio greffons ship inside their own compose project. Those stay as
# they are; this entry exists so Grafana, Forgejo, custom app deploys and any
# external service can federate against one login the operator controls.
#
#   {{ instance_url }}/                     -> account console
#   {{ instance_url }}/admin/               -> admin console (bootstrap admin)
#   {{ instance_url }}/realms/<realm>/...   -> OIDC / SAML endpoints
#
# Production mode, not start-dev: state lives in Postgres so realms, clients and
# user accounts survive a restart. An identity provider that forgets its users
# locks every federated app out, so the DB is not optional here.
#
# TLS is terminated by the greffer's per-instance nginx sidecar, which proxies
# plain HTTP upstream and sets `X-Forwarded-Proto: https` (see the greffer nginx
# template).
#
# Be precise about who does what here, because it is easy to get backwards: the
# https:// issuer and redirect URLs come from KC_HOSTNAME, NOT from the proxy
# headers. When hostname is a complete URL, Keycloak resolves nothing from
# X-Forwarded-*, and it emits https even if the header is absent entirely
# (verified against 26.3.4). KC_PROXY_HEADERS=xforwarded buys exactly one thing:
# the client IP that lands in Keycloak's admin/login event log.
#
# That client IP is attacker-controllable. Keycloak takes the LEFTMOST
# X-Forwarded-For value and the sidecar APPENDS rather than replaces
# ($proxy_add_x_forwarded_for), so a request carrying its own header has that
# value recorded as the source of a login attempt. A real client IP is still
# worth more than the sidecar's container IP for an IdP audit trail, so this
# stays on, but treat the recorded address as a hint, not evidence. The durable
# fix belongs in the greffer's nginx template, not here.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    restart: on-failure
    # `start` (production) rather than `start-dev`. The stock image is not
    # pre-built for this configuration, so the first boot runs a Quarkus
    # augmentation (~5s, logged as "Updating the server image") and then the
    # Postgres schema migration before serving. Measured cold start against a
    # real greffer: ~20s once the image is pulled.
    command: ["start"]
    # Long form with a condition, not a bare list. Keycloak fails fast on an
    # unreachable database ("Failed to obtain JDBC connection", exit 1); with a
    # bare depends_on a cold start crash-loops until Postgres catches up, and
    # while it restarts the greffer maps the container to `stopped`, which makes
    # the whole instance report the `unknow` status the manager rejects. Gating
    # on the Postgres healthcheck below removes that window.
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KC_DB: "postgres"
      KC_DB_URL_HOST: "postgresql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      # KC_DB_PASSWORD injected (platform-minted, shared with POSTGRES_PASSWORD)
      KC_DB_PASSWORD: ""
      # First-boot admin. Keycloak creates this user in the master realm only
      # when no admin exists yet; changing it later has no effect. Keycloak 26
      # logs it as a TEMPORARY admin (KC-SERVICES0077): create a permanent
      # admin account from the console and drop this one.
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      # KC_BOOTSTRAP_ADMIN_PASSWORD injected (user-supplied, required)
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
      # Public origin. Keycloak bakes this into the OIDC issuer, the discovery
      # document and every redirect, so it must be the browser-facing URL, not
      # an internal service name.
      KC_HOSTNAME: "{{ instance_url }}"
      # Accept plain HTTP from the sidecar (TLS is terminated one hop up) and
      # trust its X-Forwarded-* headers.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      # Health endpoints on the management interface (port 9000, not published).
      KC_HEALTH_ENABLED: "true"
    # The image ships neither curl nor wget, so the probe is bash's /dev/tcp
    # against the management port. That works under CMD-SHELL because /bin/sh in
    # this image IS bash (5.1.8); a future base-image switch to dash would break
    # it. Verified against 26.3.4: returns 0 on a ready server and 1 when the
    # port is wrong. NOTE this does not change when the
    # manager reports STARTED: the greffer derives instance status from container
    # state, not container health, so an instance still reads as started for the
    # ~20s before Keycloak serves. Lifting that is a platform change, not a
    # catalog one.
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q ''"status": "UP"'' <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgresql:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      # POSTGRES_PASSWORD injected (same config as KC_DB_PASSWORD above)
      POSTGRES_PASSWORD: ""
    # Hot DB backup hooks, read by the greffer as service labels (same shape as
    # the umami entry). dump: pg_dump custom format to stdout; restore:
    # pg_restore from stdin, --clean --if-exists so a re-restore drops and
    # recreates. Both run as the local superuser over the unix socket (trust
    # auth), so no password reaches the command line.
    labels:
      com.greffon.backup.dump: "pg_dump -U keycloak -d keycloak -Fc"
      com.greffon.backup.restore: "pg_restore -U keycloak -d keycloak --clean --if-exists --no-owner --single-transaction"
    # Required by the greffer's hot DB restore (_wait_db_healthy): it waits for
    # this healthcheck before streaming pg_restore in.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
