version: "3"

# Keycloak: standalone identity provider (OIDC / OAuth2 / SAML).
#
# This is the *unbundled* Keycloak: a first-class greffon an operator runs once
# and points other apps at, rather than the per-app embedded Keycloak that the
# Docs and Visio greffons ship inside their own compose project. Those stay as
# they are; this entry exists so Grafana, Forgejo, custom app deploys and any
# external service can federate against one login the operator controls.
#
#   {{ instance_url }}/                     -> account console
#   {{ instance_url }}/admin/               -> admin console (bootstrap admin)
#   {{ instance_url }}/realms/<realm>/...   -> OIDC / SAML endpoints
#
# Production mode, not start-dev: state lives in Postgres so realms, clients and
# user accounts survive a restart. An identity provider that forgets its users
# locks every federated app out, so the DB is not optional here.
#
# TLS is terminated by the greffer's per-instance nginx sidecar, which proxies
# plain HTTP upstream and sets `X-Forwarded-Proto: https` (see the greffer nginx
# template).
#
# Be precise about who does what here, because it is easy to get backwards: the
# https:// issuer and redirect URLs come from KC_HOSTNAME, NOT from proxy headers.
# When hostname is a complete URL, Keycloak resolves nothing from X-Forwarded-*,
# and it emits https even with the header absent entirely. Spoofed
# X-Forwarded-Host / -Port / -Proto and a spoofed Host all leave the issuer alone.
#
# KC_PROXY_HEADERS is deliberately NOT set. Its only effect here would be to make
# Keycloak read the client IP from X-Forwarded-For for its login and admin event
# log. The sidecar APPENDS to that header ($proxy_add_x_forwarded_for) rather than
# replacing it, and Keycloak takes the LEFTMOST value, so any unauthenticated
# client can choose the IP recorded against a failed login. On an identity
# provider the event log is a security control: a forgeable address is worse than
# an unhelpful one, because it can frame a third party and poison anything built
# on it. Without the flag Keycloak records the sidecar's container IP, which is
# useless but true. Re-add it once the greffer's nginx template sets
# X-Forwarded-For to $remote_addr.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    # unless-stopped, not the catalog's usual on-failure. Docker only revives
    # `always` and `unless-stopped` containers when the daemon itself restarts,
    # so an on-failure pair would stay down after a host reboot while the
    # greffer's injected nginx sidecar (which IS `unless-stopped`, see the
    # greffer's compose.py) comes back and serves 502s. On an ordinary app that
    # is one app down; here it is every federated app's login down until someone
    # notices. `unless-stopped` still honours an operator stop through the
    # manager, so it does not fight the platform's lifecycle.
    restart: unless-stopped
    # `start` (production) rather than `start-dev`. The stock image is not
    # pre-built for this configuration, so the first boot runs a Quarkus
    # augmentation (~5s, logged as "Updating the server image") and then the
    # Postgres schema migration before serving. Measured cold start against a
    # real greffer: ~20s once the image is pulled.
    command: ["start"]
    # Bare list, deliberately, and this is load-bearing: do not "improve" it to
    # `condition: service_healthy`. That was tried and measured, and it is worse
    # in three ways. Compose creates this container but does not START it until
    # Postgres is healthy (>=10s), docker DNS does not resolve a created-but-
    # unstarted container, and the greffer's sidecar resolves its upstream at
    # nginx config-parse time, so the sidecar dies with `host not found in
    # upstream "keycloak:8080"` and crash-loops: measured 7 sidecar restarts and
    # ~16s of connection-refused on the public URL, against ~2s for the bare
    # form. It also extends the window in which the greffer reports the `unknow`
    # instance status, including on warm restarts where the bare form has none,
    # and a backup landing inside that window aborts with `instance_missing`.
    # The problem it was meant to solve does not reproduce anyway: Keycloak
    # spends its first several seconds in Quarkus augmentation before it opens a
    # JDBC connection, by which time Postgres is up, and the restart policy
    # above covers the case where it is not.
    depends_on:
      - postgresql
    ports:
      - "8080:8080"
    environment:
      KC_DB: "postgres"
      KC_DB_URL_HOST: "postgresql"
      KC_DB_URL_DATABASE: "keycloak"
      KC_DB_USERNAME: "keycloak"
      # KC_DB_PASSWORD injected (platform-minted, shared with POSTGRES_PASSWORD)
      KC_DB_PASSWORD: ""
      # First-boot admin. Keycloak creates this user in the master realm only
      # when no admin exists yet; changing it later has no effect. Keycloak 26
      # logs it as a TEMPORARY admin (KC-SERVICES0077): create a permanent
      # admin account from the console and drop this one.
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      # KC_BOOTSTRAP_ADMIN_PASSWORD injected (user-supplied, required)
      KC_BOOTSTRAP_ADMIN_PASSWORD: ""
      # Public origin. Keycloak bakes this into the OIDC issuer, the discovery
      # document and every redirect, so it must be the browser-facing URL, not
      # an internal service name.
      KC_HOSTNAME: "{{ instance_url }}"
      # Accept plain HTTP from the sidecar (TLS is terminated one hop up).
      KC_HTTP_ENABLED: "true"
      # Health endpoints on the management interface (port 9000, not published).
      KC_HEALTH_ENABLED: "true"
    # NO healthcheck here, for an upstream reason rather than squeamishness.
    # Keycloak's /health/ready carries no datasource check: with Postgres stopped
    # it still answers 200 {"status": "UP"} while every token request 500s
    # (checked on 26.3.4 and 26.7.2). A probe that calls a server healthy when it
    # cannot serve is worse than no probe, because whatever consumes it next,
    # such as a `condition: service_healthy` gate, inherits the lie. 26.7.2 also
    # nests per-subsystem checks in that body, each with its own "status": "UP",
    # so a naive grep would match even a DOWN aggregate. Nothing consumes a
    # keycloak healthcheck today in any case: the greffer derives instance status
    # from container state, not health. Revisit if upstream ships a
    # datasource-aware readiness endpoint.

  postgresql:
    image: postgres:16-alpine
    # Same reasoning as keycloak above: must survive a daemon or host restart.
    restart: unless-stopped
    environment:
      POSTGRES_DB: "keycloak"
      POSTGRES_USER: "keycloak"
      # POSTGRES_PASSWORD injected (same config as KC_DB_PASSWORD above)
      POSTGRES_PASSWORD: ""
    # Hot DB backup hooks, read by the greffer as service labels (same shape as
    # the umami entry). dump: pg_dump custom format to stdout; restore:
    # pg_restore from stdin, --clean --if-exists so a re-restore drops and
    # recreates. Both run as the local superuser over the unix socket (trust
    # auth), so no password reaches the command line.
    labels:
      com.greffon.backup.dump: "pg_dump -U keycloak -d keycloak -Fc"
      com.greffon.backup.restore: "pg_restore -U keycloak -d keycloak --clean --if-exists --no-owner --single-transaction"
    # Required by the greffer's hot DB restore (_wait_db_healthy): it waits for
    # this healthcheck before streaming pg_restore in.
    healthcheck:
      # -h 127.0.0.1 on purpose: the postgres entrypoint runs a TEMPORARY server
      # on the unix socket during initdb, and a socket-based pg_isready reports
      # ready against it about a second before the real server exists. That temp
      # server sets listen_addresses='', so forcing TCP cannot see it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
