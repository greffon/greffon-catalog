version: "3"

# OpenFamily: privacy-first family manager (shopping, tasks, calendar,
# recipes, meal planning, budget). Upstream: https://github.com/NexaFlowFrance/OpenFamily (AGPL-3.0).
#
# Packaging note: upstream ships a split client/server compose that BUILDS from
# source, bakes the API URL into the client at build time, and serves the SPA on
# a second public host. Neither fits the greffer's single-URL, single-proxy
# model. We instead run OpenFamily's own built-in single-origin mode:
#   - `app` is a combined image (greffon-built) that serves the SPA + /api + /ws
#     on one port via the upstream-supported SERVE_CLIENT_DIR flag. The client
#     bundle is built with empty VITE_* so it talks to the same origin (relative
#     API, window.location-derived WebSocket).
#   - `db` is postgres:16-alpine with upstream's server/schema.sql baked into
#     docker-entrypoint-initdb.d (the catalog can't mount host files). The server
#     applies its incremental migrations idempotently on every boot.
# Both images are pure packaging (no source fork); see ./image/.

services:
  app:
    image: ghcr.io/greffon/openfamily:v1.2.0
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      SERVE_CLIENT_DIR: /app/client
      NODE_ENV: production
      SERVER_PORT: "3001"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: openfamily
      POSTGRES_USER: openfamily
      # Per-instance DB password (instance_id is unique per deploy; app and db
      # share the same rendered value, so no cross-instance reuse).
      POSTGRES_PASSWORD: "{{ instance_id }}"
      # Same-origin now, but the server still CORS-checks; pin it to the instance.
      CORS_ORIGINS: "{{ instance_url }}"
      # JWT_SECRET is injected by the greffer from a platform-minted secret
      # (see metadata.json). The server rejects absent/short/placeholder values.
      # REGISTRATION_ENABLED is also injected (see metadata.json).
    depends_on:
      # service_healthy gate: the server's runMigrations() issues its first query
      # immediately with no retry and exits(1) on ECONNREFUSED. A fresh db runs
      # initdb + the baked schema before accepting connections, so without this
      # gate the app crash-loops (restart: on-failure) until Postgres is up.
      db:
        condition: service_healthy
    volumes:
      - openfamily_uploads:/app/uploads

  db:
    image: ghcr.io/greffon/openfamily-db:v1.2.0
    restart: on-failure
    environment:
      POSTGRES_DB: openfamily
      POSTGRES_USER: openfamily
      POSTGRES_PASSWORD: "{{ instance_id }}"
    healthcheck:
      # -h 127.0.0.1 forces TCP: without it pg_isready answers over the unix
      # socket, which the initdb-phase temp server already serves, releasing
      # the app before :5432 exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openfamily -d openfamily"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - openfamily_db:/var/lib/postgresql/data

# No SMTP: OpenFamily has no email integration (sharing is link-based).
# Web Push (VAPID) is left unconfigured in v1: valid keys are an EC P-256
# keypair, which the platform's secret generator can't produce; push is off.

volumes:
  openfamily_db:
  openfamily_uploads:
