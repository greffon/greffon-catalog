name: Validate Greffon Catalog

on:
  pull_request:
    branches: [main]

# Read-only token. This workflow executes PR-authored content by design:
# `npm install` postinstall hooks, `docker build` on a PR's Dockerfile, and
# `docker-compose up` of a PR's stack. None of it needs write scope.
permissions:
  contents: read

jobs:
  # ─── Job 1: Static Validation ──────────────────────────────────────────
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # python-datauri: decode render-flagged file defaults with the SAME
        # parser the greffer uses, so validation can't false-accept a data-URI
        # that the greffer would reject at deploy.
        run: pip install pyyaml jinja2 python-datauri

      - name: Run linter regression tests
        # Proves every check in validate_catalog.py would have caught a real bug
        # we shipped. Add a new test alongside any new check.
        run: python .github/scripts/tests_validate_catalog.py

      - name: Detect changed greffons
        id: detect
        # Both values reach the shell as env vars, never as `${{ }}` inside the
        # script body — see the note on the strict-validate step below.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Also match files under a greffon's image/ dir (self-built images,
          # e.g. remotion): a Dockerfile/source change must re-smoke the greffon
          # so the candidate image is exercised before merge. The sed collapses
          # any matched path to its <name>/<version> root (image/ files sit one
          # level deeper than metadata.json, so strip to the first two
          # components rather than just the filename).
          # Records stay NUL-DELIMITED until each directory name is validated.
          # Three silent-skip bugs came out of treating these paths as text,
          # all the same shape: an entry that validate_catalog.py --all happily
          # validates disappears from CHANGED, has_changes goes false, and that
          # greffon's integration smoke never runs, on a green PR.
          #   1. a narrowed grep dropped names like foo+bar
          #   2. git core.quotePath C-quotes non-ASCII, so cafe/1.0/... arrived
          #      quoted and failed the anchored match
          #   3. splitting NUL records on newlines fragmented a name containing
          #      a literal newline, so [ -d ] dropped every piece
          #
          # -z for raw bytes, read -d "" so a newline inside a name is just
          # data, parameter expansion for the components (never sed/grep on the
          # raw value), and an explicit reject for anything outside the safe
          # charset. Newlines cannot survive that charset.
          changed=()
          unsafe=()
          # Detected inside this NUL-safe loop rather than by a second grepped
          # `git diff`: one git call, and no pattern matching against raw paths.
          # The harness is more than the runner script. playwright.config.ts
          # governs every spec (run_smoke shells `npx playwright test` from the
          # catalog root) and package.json pins @playwright/test, so a change to
          # either breaks smoking just as thoroughly as the script itself.
          harness_changed=0
          while IFS= read -r -d "" path; do
            case "$path" in
              .github/scripts/ci_greffer_smoke.py) harness_changed=1 ;;
              .github/workflows/validate-greffon.yml) harness_changed=1 ;;
              playwright.config.ts|package.json) harness_changed=1 ;;
            esac
            case "$path" in
              .*) continue ;;
              */*/metadata.json|*/*/docker-compose.yml) ;;
              */*/smoke_test.json|*/*/smoke_test.spec.ts) ;;
              */*/image/*) ;;
              *) continue ;;
            esac
            name="${path%%/*}"
            rest="${path#*/}"
            version="${rest%%/*}"
            dir="$name/$version"
            # bash [[ =~ ]], NOT grep. grep splits its input on newlines, so a
            # directory named `we<newline>ird` would have its fragment `ird/1.0`
            # match and the whole name would sail through as "safe". [[ =~ ]]
            # matches against the entire string, where $ is end-of-string, so an
            # embedded newline can never satisfy this charset.
            if [[ ! "$dir" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              unsafe+=("$(printf "%q" "$dir")")
              continue
            fi
            # Drop directories that no longer exist (a delisted greffon): git
            # still lists the path, but downstream consumers open files under
            # it and would fail on a legitimate deletion.
            [ -d "$dir" ] || continue
            seen=0
            for c in ${changed[@]+"${changed[@]}"}; do [ "$c" = "$dir" ] && seen=1 && break; done
            [ "$seen" = "1" ] || changed+=("$dir")
          done < <(git diff --name-only -z origin/"$BASE_REF"...HEAD)

          # Refuse unsafe names LOUDLY rather than dropping them. A security
          # filter that silently removes test coverage is worse than the
          # injection it replaced, because nobody finds out. %q so a control
          # character in the name is visible in the log rather than mangling it.
          if [ ${#unsafe[@]} -gt 0 ]; then
            echo "::error::Greffon directory names must match [A-Za-z0-9_][A-Za-z0-9._-]* in both the name and version component. Rename these and push again:"
            printf '  %s\n' "${unsafe[@]}"
            exit 1
          fi
          # A change to the smoke harness or to this workflow must re-smoke
          # SOMETHING, or the change ships unexercised. The detector above only
          # matches entry files, and skips dotted paths outright, so a PR that
          # touches only .github/ produces an empty list and the integration job
          # runs against nothing while reporting green. That is how a harness
          # regression would reach main unnoticed. Fall back to a canary entry:
          # excalidraw is the fast static app the job comment already names as a
          # proven end-to-end case.
          if [ ${#changed[@]} -eq 0 ] && [ "$harness_changed" = "1" ]; then
            # Pick the first existing entry that has a smoke spec rather than
            # naming one. Hard-coding excalidraw meant a PR delisting it while
            # touching the harness would inject a directory that had just been
            # deleted, and the run would fail citing a greffon the author removed
            # on purpose, with nothing pointing at the canary. This also keeps the
            # [ -d ] invariant the strict-validate step relies on downstream.
            # Prefer excalidraw (the fast static app this job's comment already
            # names as proven end to end), but do not hard-code it: fall back to
            # the first real entry with a spec so delisting it while touching the
            # harness does not inject a directory that no longer exists.
            canary=""
            if [ -d "excalidraw/1.0" ] && [ -f "excalidraw/1.0/smoke_test.spec.ts" ]; then
              canary="excalidraw/1.0"
            else
              for d in */1.0; do
                # Skip _template: it sorts first and is a scaffold full of TODO
                # placeholders that cannot deploy, so picking it would fail every
                # harness PR with an error about the template, not the change.
                case "$d" in _*) continue ;; esac
                [ -d "$d" ] && [ -f "$d/smoke_test.spec.ts" ] && canary="$d" && break
              done
            fi
            if [ -n "$canary" ]; then
              echo "Harness changed with no greffon changes: smoking canary $canary."
              changed+=("$canary")
            else
              # Loud, never silent: a harness change that exercises nothing is
              # exactly the hole this fallback exists to close.
              echo "::error::Harness changed but no greffon with a smoke spec was found to use as a canary."
              exit 1
            fi
          fi
          CHANGED=$(printf '%s\n' ${changed[@]+"${changed[@]}"})
          echo "changed_dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No greffon files changed."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed greffons:"
            echo "$CHANGED"
          fi

      - name: Validate all greffons
        run: python .github/scripts/validate_catalog.py --all

      - name: Validate changed greffons (strict)
        if: steps.detect.outputs.has_changes == 'true'
        # changed_dirs via env, NEVER `${{ }}` inside `run:`. Actions substitutes
        # ${{ }} into the script TEXT before bash parses it, so a directory name
        # containing $(...), backticks or `;` executes as code. This is a PUBLIC
        # repo that invites third-party greffon PRs, and this value is derived
        # from attacker-controlled path names: a PR adding a directory literally
        # named `x$(id)` produced a green run that executed `id`. The
        # integration job below already used env; this step did not.
        #
        # printf '%s\n' rather than echo: echo mangles values starting with -n
        # or containing backslashes.
        env:
          CHANGED_DIRS: ${{ steps.detect.outputs.changed_dirs }}
        run: |
          printf '%s\n' "$CHANGED_DIRS" | while IFS= read -r dir; do
            # changed_dirs is already filtered to existing dirs in the detect
            # step, so removed greffons never reach here (or the integration job).
            [ -n "$dir" ] && python .github/scripts/validate_catalog.py --dir "$dir"
          done

    outputs:
      changed_dirs: ${{ steps.detect.outputs.changed_dirs }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

  # ─── Job 2: Integration Test (greffer-only) ────────────────────────────
  # Deploys each changed greffon through the PUBLIC greffon/greffer and runs
  # its Playwright smoke spec against the live instance. No manager, no private
  # repos, no PAT — the greffer is the component that does the real render +
  # deploy (where catalog bugs live); the thin manager role (token + cert +
  # /start payload) is reproduced from each entry's metadata.json by the runner.
  integration:
    name: Integration Test
    needs: validate
    if: needs.validate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Generous timeout: heavy entries (large images, multi-service stacks like
    # Immich/Multica) must pull + boot within this. Bump if a legitimate greffon
    # needs more rather than weakening the gate.
    timeout-minutes: 45
    # Hard gate: proven end-to-end in CI on a static app (Excalidraw) and a
    # stateful/volume app (Memos). A failing smoke now blocks merge.

    steps:
      - name: Checkout PR catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: greffon-catalog

      - name: Checkout public greffer
        uses: actions/checkout@v4
        with:
          repository: greffon/greffer
          path: greffer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the greffer's runtime deps via its OWN poetry lock. Manual pins
      # are fragile here: docker SDK 5.x speaks the `http+docker://` scheme that
      # urllib3 v2 rejects, and a loose `requests`/`urllib3` resolution pulls
      # urllib3 v2 (-> "Not supported URL scheme http+docker" at greffer boot).
      # poetry resolves the exact, known-good set. The runner then runs under
      # this env (`poetry run`), so its uvicorn subprocess (sys.executable)
      # inherits the same interpreter + deps.
      - name: Install greffer deps (poetry)
        working-directory: greffer
        run: |
          pip install poetry
          poetry install --no-interaction

      # The greffer shells out to `docker-compose` (v1, hyphenated). ubuntu-24.04
      # ships only the `docker compose` v2 plugin, so provide a `docker-compose`
      # on PATH (the v2 binary works as a standalone `docker-compose`).
      - name: Ensure docker-compose binary
        run: |
          if ! command -v docker-compose >/dev/null 2>&1; then
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Resolve the pinned version first so the cache key below is exact rather
      # than a guess, and so a @playwright/test bump invalidates it on its own.
      - name: Install node deps
        id: npmdeps
        working-directory: greffon-catalog
        timeout-minutes: 10
        run: |
          npm install --silent
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.npmdeps.outputs.version }}-chromium

      # NOT `--with-deps`. That flag shells out to `sudo sh -c "apt-get update &&
      # apt-get install"`, and on this runner it hung three separate times for the
      # full 45-minute job timeout, emitting no output at all: not one apt line, so
      # it stalled before apt printed anything (mirror stall, or blocked on the
      # dpkg lock that unattended-upgrades holds on a fresh runner). The evidence
      # is the cancelled job's orphan list, which names
      # `npm exec playwright install --with-deps chromium` with `sh` and `node`
      # children and nothing else. Steps 9 onward were skipped, so the greffon was
      # never deployed and the run reported a red check that was not a real
      # failure.
      #
      # The ubuntu-latest image already ships the shared libraries Chromium needs
      # (it preinstalls Chrome, Firefox and Edge), so the browser binary alone is
      # enough here. If a launch ever does fail on a missing library, add a bounded
      # apt step installing exactly that library with
      # `-o DPkg::Lock::Timeout=120`, rather than restoring an unbounded helper.
      #
      # timeout-minutes is the point as much as the flag change: a hang now fails
      # in 10 minutes naming this step, instead of consuming the job budget and
      # surfacing as a generic cancellation that reads like a broken greffon.
      - name: Install Playwright browser
        working-directory: greffon-catalog
        timeout-minutes: 10
        run: npx playwright install chromium

      # Self-built images (a greffon shipping an image/Dockerfile, e.g.
      # remotion) are only published to GHCR on push to main, so the tag the
      # compose references does not exist during a PR. Build it locally and tag
      # it as the compose's image: ref, so the greffer's `docker-compose up`
      # finds it on the runner's daemon and never pulls. This makes PR CI smoke
      # the candidate image instead of a stale/absent registry tag. No-op for
      # greffons that reference an upstream public image.
      - name: Build self-built greffon images
        if: needs.validate.outputs.has_changes == 'true'
        working-directory: greffon-catalog
        env:
          CHANGED_DIRS: ${{ needs.validate.outputs.changed_dirs }}
        run: |
          echo "$CHANGED_DIRS" | while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            [ -f "$dir/image/Dockerfile" ] || continue
            compose="$dir/docker-compose.yml"
            # Every image: line pointing at our own registry is a candidate
            # built from this dir's image/ context.
            grep -E '^[[:space:]]*image:[[:space:]]*ghcr\.io/greffon/' "$compose" \
              | sed -E 's|^[[:space:]]*image:[[:space:]]*||' \
              | while IFS= read -r tag; do
                  echo "Building $tag from $dir/image"
                  docker build -t "$tag" "$dir/image"
                done
          done

      # Instances must NOT be deployed at https://localhost. Loopback is a secure
      # context to browsers and to several server frameworks, so cookie flags that
      # would be wrong on a real hostname come out right there and the smoke test
      # passes. A Keycloak session-cookie regression reached a green pipeline
      # exactly this way. Mapping a name in /etc/hosts keeps it resolvable with no
      # external DNS dependency.
      - name: Map the smoke hostname to loopback
        run: echo "127.0.0.1 catalog-ci.test" | sudo tee -a /etc/hosts

      - name: Deploy + smoke each changed greffon (greffer-only)
        working-directory: greffer
        env:
          GREFFER_DIR: ${{ github.workspace }}/greffer
          CHANGED_DIRS: ${{ needs.validate.outputs.changed_dirs }}
          CI_PUBLIC_HOST: catalog-ci.test
        run: |
          # Run under the greffer's poetry env so uvicorn + docker SDK (with the
          # correct urllib3<2) are on the interpreter the runner launches.
          poetry run python "$GITHUB_WORKSPACE/greffon-catalog/.github/scripts/ci_greffer_smoke.py" \
            --changed-dirs "$CHANGED_DIRS"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            greffon-catalog/.playwright/
